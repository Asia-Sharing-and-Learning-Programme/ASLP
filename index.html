<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2; --surface-1: #fcfcfb; --border: #e2e1dc; --grid: #ecebe7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
    --blue: #005fc0; --navy: #24215f; --yellow: #f5c400; --orange: #e04c1e; --listen: #0a84ff;
    --spea: #1a5cba; --sasia: #e24a1b; --spea1: #188afd; --spea2: #2e6be0; --sasia1: #fe6809; --sasia2: #ff8228;
    --s0: #24215f; --s1: #0a84ff; --s2: #f5c400; --s3: #c0391e; --s4: #005fc0; --s5: #e04c1e; --s6: #6f6e69;
  }
  @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
    color-scheme: dark; --surface-0: #121211; --surface-1: #1a1a19; --border: #2f2f2c; --grid: #262624;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --blue: #3d86dc; --navy: #4a46a8; --spea: #5b93e6; --sasia: #f0703f; --spea2: #5a8ef0; --s0: #4a46a8; --s4: #2f7fd6; --s6: #9a9993; } }
  :root[data-theme="dark"] {
    color-scheme: dark; --surface-0: #121211; --surface-1: #1a1a19; --border: #2f2f2c; --grid: #262624;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --blue: #3d86dc; --navy: #4a46a8; --spea: #5b93e6; --sasia: #f0703f; --spea2: #5a8ef0; --s0: #4a46a8; --s4: #2f7fd6; --s6: #9a9993; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--surface-0); color: var(--text-primary); }
  a { color: var(--blue); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .logo-dark { display: none !important; }
  @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .logo-light { display: none !important; } :root:where(:not([data-theme="light"])) .logo-dark { display: block !important; } }
  :root[data-theme="dark"] .logo-light { display: none !important; } :root[data-theme="dark"] .logo-dark { display: block !important; }

  /* top bar + menu */
  .topbar { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--surface-0) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .topbar .wrap { display: flex; align-items: center; gap: 18px; height: 64px; }
  .brand { display: flex; align-items: center; text-decoration: none; flex: none; }
  .brand img { height: 40px; width: auto; display: block; }
  nav.menu { display: flex; gap: 2px; flex-wrap: nowrap; margin-left: auto; align-items: center; }
  nav.menu a { padding: 8px 12px; border-radius: 999px; text-decoration: none; color: var(--text-primary); font-weight: 600; font-size: 14px; white-space: nowrap; }
  nav.menu a:hover { background: color-mix(in srgb, var(--blue) 9%, transparent); }
  nav.menu a.on { background: var(--blue); color: #fff; }
  nav.menu a.ext::after { content: " ↗"; font-weight: 400; opacity: .7; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
  .seg button { border: 0; background: none; padding: 5px 9px; font: inherit; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
  .seg button.on { background: color-mix(in srgb, var(--text-primary) 8%, transparent); color: var(--text-primary); font-weight: 700; }
  .menu-btn { display: none; margin-left: auto; border: 1px solid var(--border); background: var(--surface-1); border-radius: 10px; padding: 7px 12px; font: inherit; font-weight: 700; color: var(--text-primary); cursor: pointer; }
  @media (max-width: 980px) {
    .menu-btn { display: inline-flex; }
    nav.menu { display: none; position: absolute; top: 64px; left: 0; right: 0; flex-direction: column; align-items: stretch; background: var(--surface-1); border-bottom: 1px solid var(--border); padding: 10px 16px 16px; gap: 4px; }
    nav.menu.open { display: flex; }
    nav.menu a { padding: 11px 14px; font-size: 15px; }
    .topbar .theme { display: none; }
    nav.menu .theme-in-menu { display: flex !important; justify-content: center; margin-top: 6px; }
  }
  .theme-in-menu { display: none !important; }

  /* page bits */
  main { padding: 26px 0 60px; min-height: 60vh; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.3px; }
  h2 { font-size: 21px; margin: 0 0 10px; }
  h3 { font-size: 16px; margin: 0 0 6px; }
  .lead { font-size: 16.5px; color: var(--text-secondary); max-width: 760px; margin: 0 0 18px; }
  .muted { color: var(--text-muted); }
  .crumbs { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
  .crumbs a { color: var(--text-secondary); text-decoration: none; } .crumbs a:hover { text-decoration: underline; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .g4 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  a.card { text-decoration: none; color: inherit; display: block; transition: border-color .15s, box-shadow .15s, transform .15s; }
  a.card:hover { border-color: color-mix(in srgb, var(--blue) 45%, var(--border)); box-shadow: 0 4px 16px rgba(0,0,0,.06); transform: translateY(-1px); }
  .section { margin-top: 30px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: color-mix(in srgb, var(--blue) 10%, transparent); color: var(--blue); margin: 0 6px 6px 0; }
  .empty { color: var(--text-muted); font-style: italic; }
  .soon { border: 1px dashed var(--border); border-radius: 14px; padding: 26px; text-align: center; color: var(--text-secondary); background: var(--surface-1); }

  /* home hero */
  .hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: center; padding: 10px 0 8px; }
  .hero img { width: 100%; max-width: 640px; height: auto; display: block; }
  .hero h1 { font-size: 34px; }
  @media (max-width: 820px) { .hero { grid-template-columns: 1fr; gap: 14px; } .hero h1 { font-size: 27px; } }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; margin: 6px 0 18px; }
  .stat b { display: block; font-size: 28px; line-height: 1.1; }
  .stat span { font-size: 12.5px; color: var(--text-muted); }
  .tile h3 { font-size: 17px; margin-bottom: 4px; }
  .tile p { margin: 0; color: var(--text-secondary); font-size: 14px; }
  .tile .bar { height: 5px; border-radius: 3px; margin-bottom: 14px; width: 46px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 10px 20px; font-weight: 700; text-decoration: none; border: 2px solid var(--blue); font-size: 14.5px; }
  .btn.fill { background: var(--blue); color: #fff; } .btn.line { color: var(--blue); }

  /* branding: zone + CWG lockups */
  .mini-lock, .zone-lock, .cwg-lock { font-family: "Helvetica Neue", Arial, sans-serif; }
  .mini-lock { font-weight: 900; letter-spacing: -.5px; line-height: 1; }
  .mini-lock .cl-zone, .cwg-lock .cl-zone { color: var(--cwg-b); } .mini-lock .cl-num, .cwg-lock .cl-num { color: var(--cwg-a); margin-left: 1px; }
  .cwg-lock { font-weight: 900; line-height: 1; letter-spacing: -1px; }
  .cwg-lock.lg { font-size: 54px; letter-spacing: -2.5px; } .cwg-lock.md { font-size: 32px; } .cwg-lock.sm { font-size: 20px; }
  .zone-lock { display: inline-flex; flex-direction: column; line-height: 1; }
  .zone-lock .zl-name { color: var(--cwg-b); font-weight: 900; }
  .zone-lock .zl-sub { color: var(--text-primary); font-weight: 400; white-space: nowrap; }
  .zone-lock.lg .zl-name { font-size: 58px; letter-spacing: -2.5px; } .zone-lock.lg .zl-sub { font-size: 14px; letter-spacing: 4px; margin-top: 5px; }
  .zone-lock.md .zl-name { font-size: 38px; letter-spacing: -1.8px; } .zone-lock.md .zl-sub { font-size: 11px; letter-spacing: 2.4px; margin-top: 4px; }
  @media (max-width: 560px) { .zone-lock.lg .zl-name { font-size: 44px; } .zone-lock.lg .zl-sub { font-size: 11px; letter-spacing: 2.5px; } .cwg-lock.lg { font-size: 44px; } }
  .zone-band { border-left: 5px solid var(--cwg-b); padding: 4px 0 4px 16px; margin-bottom: 16px; }
  .cwg-card { border-top: 5px solid var(--cwg-a); }
  .lead-line { font-size: 13.5px; color: var(--text-secondary); margin-top: 8px; }
  .terr-list { list-style: none; margin: 12px 0 0; padding: 0; font-size: 14px; }
  .terr-list li { padding: 6px 0; border-top: 1px solid var(--grid); }

  /* territory profile */
  .prof { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 860px) { .prof { grid-template-columns: 1fr; } }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 22px; }
  .facts .k { font-size: 12px; color: var(--text-muted); } .facts .v { font-weight: 600; }
  .block { margin-top: 16px; } .block p { margin: 4px 0 0; white-space: pre-line; }
  .contact { padding: 12px 0; border-top: 1px solid var(--grid); }
  .contact:first-of-type { border-top: 0; padding-top: 4px; }
  .contact .nm { font-weight: 700; } .contact .rl { color: var(--text-secondary); font-size: 13.5px; }
  .contact a { font-size: 13.5px; word-break: break-all; }
  .copy { border: 1px solid var(--border); background: none; border-radius: 6px; font: inherit; font-size: 12px; padding: 2px 8px; margin-left: 6px; cursor: pointer; color: var(--text-secondary); }
  .status-chip { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
  .status-chip i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .tcard h3 { font-size: 15.5px; }
  .tcard .loc { font-size: 13px; color: var(--text-muted); }
  .tags { margin-top: 10px; }

  /* brand artwork from the ASLP presentation template */
  .art { display: block; max-width: 100%; height: auto; }
  .paper { display: inline-block; }   /* lockups with dark text sit on white "paper" in dark mode */
  @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .paper { background: #fff; border-radius: 10px; padding: 8px 12px; } :root:where(:not([data-theme="light"])) .map-bg { filter: invert(1) opacity(.35); } }
  :root[data-theme="dark"] .paper { background: #fff; border-radius: 10px; padding: 8px 12px; }
  :root[data-theme="dark"] .map-bg { filter: invert(1) opacity(.35); }
  .doodle-band { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 22px 0 8px; align-items: center; }
  .doodle-band img { width: 100%; height: 110px; object-fit: contain; }
  @media (max-width: 700px) { .doodle-band { grid-template-columns: repeat(2, 1fr); } .doodle-band img { height: 80px; } }
  .page-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; }
  .page-head .deco { width: 300px; max-width: 32vw; }
  @media (max-width: 700px) { .page-head { grid-template-columns: 1fr; } .page-head .deco { width: 100%; max-width: 360px; height: 90px; object-fit: contain; object-position: left; } }
  .zone-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: center; margin-bottom: 16px; border-left: 5px solid var(--cwg-b); padding-left: 16px; }
  .zone-head .zl img { width: 100%; max-width: 340px; }
  .zone-head .zd { height: 120px; width: 100%; object-fit: contain; object-position: right center; }
  @media (max-width: 700px) { .zone-head { grid-template-columns: 1fr; } .zone-head .zd { height: 80px; object-position: left; } }
  .cwg-card .lock-h { height: 46px; width: auto; max-width: 100%; display: block; margin-bottom: 4px; }
  .cwg-hero { position: relative; overflow: hidden; border-radius: 16px; background: var(--surface-1); border: 1px solid var(--border); padding: 26px; display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 26px; align-items: center; min-height: 260px; }
  .cwg-hero .map-bg { position: absolute; right: -40px; top: 50%; transform: translateY(-50%); width: 72%; max-width: 820px; pointer-events: none; }
  .cwg-hero > * { position: relative; }
  .cwg-hero .lock-v { width: 100%; max-width: 300px; }
  .cwg-hero .doodles { height: 150px; width: 100%; object-fit: contain; object-position: right center; justify-self: end; }
  @media (max-width: 760px) { .cwg-hero { grid-template-columns: 1fr; } .cwg-hero .lock-v { max-width: 230px; } .cwg-hero .doodles { height: 100px; object-position: left; justify-self: start; } .cwg-hero .map-bg { width: 120%; right: -30%; } }
  .terr-lock { height: 34px; width: auto; }
  footer { border-top: 1px solid var(--border); padding: 22px 0 40px; font-size: 13px; color: var(--text-muted); }
  footer .wrap { display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
  .loading { padding: 40px 0; color: var(--text-muted); }
</style>

<script>
const SUPABASE_URL = "https://emvtqqjiirgcgghcaeps.supabase.co";
const SUPABASE_KEY = "sb_publishable_cHpOvFlPWmirE_426PPIbg_XYo-klC9";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

// ---- theme (shared with the other ASLP sites) ----
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  document.querySelectorAll("[data-theme-set]").forEach(b => b.classList.toggle("on", b.dataset.themeSet === (t || "auto")));
}
let theme = "auto"; try { theme = localStorage.getItem("cds-theme") || "auto"; } catch (e) {}
applyTheme(theme);
document.querySelectorAll("[data-theme-set]").forEach(b => b.addEventListener("click", () => { theme = b.dataset.themeSet; try { localStorage.setItem("cds-theme", theme); } catch (e) {} applyTheme(theme); }));
$("menu-btn").addEventListener("click", () => { const o = $("menu").classList.toggle("open"); $("menu-btn").setAttribute("aria-expanded", o); });

// ---- branding ----
const ZONES = [
  { key: "SPEA", label: "South Pacific and East Asia", sub: "South Pacific East Asia Zones", test: c => /^spea/i.test(c) },
  { key: "SASIA", label: "South Asia", sub: "South Asia Zones", test: c => /^(sasia|south asia)/i.test(c) },
];
const zoneOf = c => (ZONES.find(z => z.test(c || "")) || { key: "OTHER" }).key;
const cwgParts = c => { const m = String(c || "").trim().match(/^(SPEA|SASIA)\s*(\d)$/i); return m ? { zone: m[1].toUpperCase(), num: m[2] } : null; };
const cwgVars = c => { const p = cwgParts(c); return p ? `--cwg-b: var(--${p.zone.toLowerCase()}); --cwg-a: var(--${p.zone.toLowerCase()}${p.num});` : "--cwg-b: var(--blue); --cwg-a: var(--blue);"; };
const zoneVars = z => `--cwg-b: var(--${z.toLowerCase()});`;
const cwgLock = (c, size) => { const p = cwgParts(c); return p ? `<span class="cwg-lock ${size}" style="${cwgVars(c)}" role="img" aria-label="${esc(c)}"><span class="cl-zone">${p.zone}</span><span class="cl-num">${p.num}</span></span>` : `<strong>${esc(c)}</strong>`; };
const zoneLock = (z, size) => { const Z = ZONES.find(x => x.key === z); return Z ? `<span class="zone-lock ${size}" style="${zoneVars(z)}" role="img" aria-label="${esc(Z.label)}"><span class="zl-name">${z}</span><span class="zl-sub">${Z.sub}</span></span>` : ""; };
const cwgSlug = c => slug(c);              // "SPEA 1" -> "spea-1"
// artwork from the ASLP presentation template (brand/)
const ART = c => { const p = cwgParts(c); if (!p) return null; const k = `${p.zone.toLowerCase()}-${p.num}`;
  return { h: `brand/cwg-${k}-h.webp`, v: `brand/cwg-${k}-v.webp`, map: `brand/map-${k}.webp`, doodles: `brand/doodles-${k}.webp` }; };
const zoneArt = z => ({ lock: `brand/zone-${z.toLowerCase()}.webp`, doodles: `brand/doodles-${z.toLowerCase()}.webp` });
const cwgImg = (c, kind, cls) => { const a = ART(c); return a ? `<img class="art ${cls || ""}" src="${a[kind]}" alt="${esc(c)} Cluster Working Group" loading="lazy">` : cwgLock(c, "md"); };
const doodleBand = list => `<div class="doodle-band" aria-hidden="true">${list.map(n => `<img src="brand/doodles-${n}.webp" alt="" loading="lazy">`).join("")}</div>`;
const STATUS = { not_started: ["Not started", "var(--s0)"], workshop: ["Consultation scheduled", "var(--s1)"], drafting: ["Drafting", "var(--s2)"], submitted: ["Submitted for approval", "var(--s3)"],
  approved: ["Approved", "var(--s4)"], implementing: ["In implementation", "var(--s5)"], ended: ["Period ended", "var(--s6)"] };
const isRegion = t => /\bregion$/i.test(String(t.name || "").trim());

// ---- data ----
let data = null, db = null;
async function load() {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: "implicit", persistSession: true, detectSessionInUrl: true, autoRefreshToken: true } });
  const { data: d, error } = await db.rpc("get_aslp_site");
  if (error) throw error;
  data = d;
}
const terrs = () => data.territories || [];
const cwgList = () => [...new Set(terrs().map(t => (t.cwg || "").trim()).filter(Boolean))].sort();
const leadOf = c => (data.cwgLeads || []).find(l => l.cwg === c);
const terrName = id => (terrs().find(t => t.id === id) || {}).name || "";

// ---- small renderers ----
const emptyTxt = (txt) => `<p class="empty">${txt || "Not added yet."}</p>`;
const tags = list => (list || []).length ? `<div class="tags">${list.map(x => `<span class="pill">${esc(x)}</span>`).join("")}</div>` : "";
const statusChip = t => { const s = STATUS[t.status]; return s ? `<span class="status-chip"><i style="background:${s[1]}"></i>${s[0]}</span>` : "—"; };
function leadHtml(c) {
  const l = leadOf(c); if (!l) return "";
  return `<div class="lead-line"><strong>CWG Lead:</strong> ${esc(l.name || "")}${l.role ? `, ${esc(l.role)}` : ""}${l.territory && terrName(l.territory) ? ` <span class="muted">(${esc(terrName(l.territory))})</span>` : ""}</div>`;
}
function contactHtml(c) {
  const name = [c.rank, c.name].filter(Boolean).join(" ");
  return `<div class="contact"><div class="nm">${esc(name)}</div>${c.role ? `<div class="rl">${esc(c.role)}</div>` : ""}
    ${c.email ? `<div><a href="mailto:${esc(c.email)}">${esc(c.email)}</a><button class="copy" data-copy="${esc(c.email)}">Copy</button></div>` : ""}</div>`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1400); } catch (err) {}
});

// ---- pages ----
function pageHome() {
  const ts = terrs(), cl = cwgList();
  const about = (data.content && data.content.about && data.content.about.body) || "";
  return `<section class="hero">
      <div><img class="logo-light" src="aslp-logo-light.png" alt="ASLP: Asia-Pacific Sharing & Learning Programme. Listen. Learn. Lead."><img class="logo-dark" src="aslp-logo-dark.png" alt="ASLP: Asia-Pacific Sharing & Learning Programme. Listen. Learn. Lead."></div>
      <div><h1>Asia-Pacific Sharing &amp; Learning Programme</h1>
        <p class="lead">${about ? esc(about.split(/\n\s*\n/)[0]).slice(0, 320) : "Salvation Army territories across South Pacific and East Asia and South Asia, listening to communities, learning from each other and leading change together."}</p>
        <div class="stats"><div class="stat"><b>${ts.length}</b><span>territories &amp; regions</span></div><div class="stat"><b>${cl.length}</b><span>Cluster Working Groups</span></div><div class="stat"><b>2</b><span>zones</span></div></div>
        <a class="btn fill" href="#/about">About ASLP</a> <a class="btn line" href="#/cwgs">Meet our CWGs</a></div>
    </section>
    ${doodleBand(["3", "5", "4", "2"])}
    <div class="section grid g3">
      ${[["#/cwgs", "Cluster Working Groups", "Meet the CWGs in SPEA and South Asia, their territories, strengths and the support they offer.", "var(--listen)"],
         ["#/groups", "ASLP Groups", "ASC, APSG, SOG and FCG: who they are and what they do.", "var(--navy)"],
         ["#/newsletter", "Newsletter", "Read ASLP newsletters as digital books.", "var(--yellow)"],
         ["/cd-strategy/", "CD Strategies", "Each territory's Community Development Strategy, from consultation to implementation.", "var(--blue)"],
         ["/Calendar-2027-2028/", "Calendar", "The ASLP planning calendar for 2027–2028 (sign-in).", "var(--orange)"],
         ["#/about", "About ASLP", "What ASLP is, why it exists and how it works.", "var(--s3)"]]
        .map(([h, t, p, c]) => `<a class="card tile" href="${h}"><div class="bar" style="background:${c}"></div><h3>${t}</h3><p>${p}</p></a>`).join("")}
    </div>`;
}
function pageAbout() {
  const a = (data.content && data.content.about) || {};
  return `<div class="crumbs"><a href="#/">Home</a> › About ASLP</div>
    <div class="page-head"><div><h1>${esc(a.title || "About ASLP")}</h1><img class="art" src="brand/aslp-tagline.webp" alt="Listen. Learn. Lead." style="max-width:380px;margin:4px 0 18px"></div><img class="deco" src="brand/doodles-1.webp" alt="" aria-hidden="true"></div>
    ${a.body ? `<div class="card" style="max-width:860px">${a.body.split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`).join("")}</div>`
      : `<div class="soon">The About ASLP text is coming soon.</div>`}`;
}
function cwgCard(c) {
  const ts = terrs().filter(t => (t.cwg || "").trim() === c);
  return `<a class="card cwg-card" style="${cwgVars(c)}" href="#/cwg/${cwgSlug(c)}">${cwgImg(c, "h", "lock-h")}${leadHtml(c)}
    <ul class="terr-list">${ts.map(t => `<li>${esc(t.name)}</li>`).join("")}</ul></a>`;
}
function zoneHead(z, link) {
  const a = zoneArt(z), Z = ZONES.find(x => x.key === z);
  const lock = `<span class="paper"><img class="art" src="${a.lock}" alt="${esc(Z.label)}"></span>`;
  return `<div class="zone-head" style="${zoneVars(z)}"><div class="zl">${link ? `<a href="#/zone/${z.toLowerCase()}" title="Open ${esc(Z.label)}">${lock}</a>` : lock}</div>
    <img class="zd" src="${a.doodles}" alt="" aria-hidden="true" loading="lazy"></div>`;
}
function pageCwgs() {
  return `<div class="crumbs"><a href="#/">Home</a> › Cluster Working Groups</div>
    <div class="page-head"><div><h1>Meet our Cluster Working Groups</h1>
    <p class="lead">ASLP territories work together in Cluster Working Groups (CWGs) within two zones. Open a CWG to see its territories, what they focus on and the support they can offer each other.</p></div><img class="deco" src="brand/doodles-5.webp" alt="" aria-hidden="true"></div>
    ${ZONES.map(z => `<section class="section">${zoneHead(z.key, true)}
      <div class="grid g2">${cwgList().filter(c => zoneOf(c) === z.key).map(cwgCard).join("")}</div></section>`).join("")}`;
}
function pageZone(zk) {
  const z = ZONES.find(x => x.key.toLowerCase() === zk); if (!z) return notFound();
  const cl = cwgList().filter(c => zoneOf(c) === z.key);
  return `<div class="crumbs"><a href="#/">Home</a> › <a href="#/cwgs">Cluster Working Groups</a> › ${esc(z.label)}</div>
    ${zoneHead(z.key, false)}
    <p class="lead">${terrs().filter(t => zoneOf(t.cwg) === z.key).length} territories and regions in ${cl.length} Cluster Working Groups.</p>
    <div class="grid g2">${cl.map(cwgCard).join("")}</div>`;
}
function terrCard(t) {
  const p = t.profile || {};
  return `<a class="card tcard" href="#/territory/${esc(t.id)}"><h3>${esc(t.name)}</h3>
    <div class="loc">${t.location ? `${isRegion(t) ? "RHQ" : "THQ"}: ${esc(t.location)}` : ""}${(t.countries || []).length > 1 ? ` · ${t.countries.length} countries` : ""}</div>
    ${tags((p.thematic || []).slice(0, 4))}</a>`;
}
function pageCwg(cs) {
  const c = cwgList().find(x => cwgSlug(x) === cs); if (!c) return notFound();
  const z = ZONES.find(x => x.key === zoneOf(c)), l = leadOf(c), ts = terrs().filter(t => (t.cwg || "").trim() === c);
  return `<div class="crumbs"><a href="#/">Home</a> › <a href="#/cwgs">Cluster Working Groups</a> › ${z ? `<a href="#/zone/${z.key.toLowerCase()}">${esc(z.label)}</a> › ` : ""}${esc(c)}</div>
    ${ART(c) ? `<div class="cwg-hero" style="${cwgVars(c)}"><img class="map-bg" src="${ART(c).map}" alt="" aria-hidden="true">
        <div><img class="art lock-v" src="${ART(c).v}" alt="${esc(c)} Cluster Working Group"><div class="muted" style="margin-top:10px">${ts.length} territories</div></div>
        <img class="doodles" src="${ART(c).doodles}" alt="" aria-hidden="true"></div>`
      : `<div style="display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px">${cwgLock(c, "lg")}<div class="muted" style="padding-bottom:6px">Cluster Working Group · ${ts.length} territories</div></div>`}
    ${l ? `<div class="card" style="max-width:560px;margin:10px 0 6px"><div class="muted" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">CWG Lead</div>
      ${contactHtml({ name: l.name, role: [l.role, l.territory && terrName(l.territory)].filter(Boolean).join(", "), email: l.email })}</div>` : ""}
    <h2 class="section">Territories</h2><div class="grid g3">${ts.map(terrCard).join("")}</div>`;
}
function pageTerritory(id) {
  const t = terrs().find(x => x.id === id); if (!t) return notFound();
  const c = (t.cwg || "").trim(), z = ZONES.find(x => x.key === zoneOf(c)), p = t.profile || {};
  const offices = (t.offices || []).map(o => o.name).filter(Boolean);
  return `<div class="crumbs"><a href="#/">Home</a> › <a href="#/cwgs">CWGs</a> › ${z ? `<a href="#/zone/${z.key.toLowerCase()}">${z.key}</a> › ` : ""}${c ? `<a href="#/cwg/${cwgSlug(c)}">${esc(c)}</a> › ` : ""}${esc(t.name)}</div>
    ${c && ART(c) ? `<a href="#/cwg/${cwgSlug(c)}">${cwgImg(c, "h", "terr-lock")}</a>` : ""}
    <h1 style="margin:10px 0 0">${esc(t.name)}</h1>
    <div class="prof section" style="margin-top:18px">
      <div class="card">
        <h2>Where they work</h2>
        <div class="facts">
          <div><div class="k">${isRegion(t) ? "Regional" : "Territorial"} Headquarters</div><div class="v">${esc(t.location || "—")}</div></div>
          <div><div class="k">Countries</div><div class="v">${esc((t.countries || []).join(", ") || "—")}</div></div>
          ${offices.length ? `<div><div class="k">Other offices</div><div class="v">${esc(offices.join(", "))}</div></div>` : ""}
        </div>
        ${p.workAreas ? `<div class="block"><p>${esc(p.workAreas)}</p></div>` : ""}
        <div class="block"><h3>Thematic areas</h3>${(p.thematic || []).length ? tags(p.thematic) : emptyTxt()}</div>
        <div class="block"><h3>Strengths</h3>${p.strengths ? `<p>${esc(p.strengths)}</p>` : emptyTxt()}</div>
        <div class="block"><h3>Technical support they can offer other territories</h3>${p.techSupport ? `<p>${esc(p.techSupport)}</p>` : emptyTxt()}</div>
      </div>
      <div class="grid" style="gap:16px">
        <div class="card"><h2>Contact persons</h2>${(t.contacts || []).length ? t.contacts.map(contactHtml).join("") : emptyTxt("Contact persons not added yet.")}</div>
        <div class="card"><h2>CD Strategy</h2><div>${statusChip(t)}</div>${t.strategyPeriod ? `<div class="muted" style="margin-top:4px">Strategy period: ${esc(t.strategyPeriod)}</div>` : ""}
          <div style="margin-top:12px"><a href="/cd-strategy/#territory-${esc(t.id)}">See CD Strategy details ↗</a></div></div>
        ${c ? `<div class="card"><h2>Cluster Working Group</h2>${cwgImg(c, "h", "terr-lock")}${leadHtml(c)}<div style="margin-top:10px"><a href="#/cwg/${cwgSlug(c)}">Other territories in ${esc(c)}</a></div></div>` : ""}
      </div>
    </div>`;
}
function pageGroups() {
  return `<div class="crumbs"><a href="#/">Home</a> › ASLP Groups</div>
    <div class="page-head"><div><h1>ASLP Groups</h1>
    <p class="lead">Alongside the Cluster Working Groups, these groups guide and support the Asia-Pacific Sharing &amp; Learning Programme.</p></div><img class="deco" src="brand/doodles-4.webp" alt="" aria-hidden="true"></div>
    <div class="grid g2">${(data.groups || []).map(g => `<a class="card tile" href="#/group/${esc(g.key)}"><div class="bar" style="background:var(--navy)"></div>
      <div style="font-family:'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:30px;letter-spacing:-1px;color:var(--navy)">${esc(g.short)}</div>
      <h3>${esc(g.name)}</h3><p>${g.description ? esc(g.description.split(/\n/)[0]).slice(0, 160) : "Details coming soon."}</p></a>`).join("")}</div>`;
}
function pageGroup(key) {
  const g = (data.groups || []).find(x => x.key === key); if (!g) return notFound();
  return `<div class="crumbs"><a href="#/">Home</a> › <a href="#/groups">ASLP Groups</a> › ${esc(g.short)}</div>
    <div style="font-family:'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:52px;letter-spacing:-2px;color:var(--navy);line-height:1">${esc(g.short)}</div>
    <h1 style="margin-top:6px">${esc(g.name)}</h1>
    <div class="prof" style="margin-top:16px">
      <div class="card"><h2>About the ${esc(g.short)}</h2>${g.description ? g.description.split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`).join("") : emptyTxt("Details coming soon.")}</div>
      <div class="card"><h2>Members</h2>${(g.members || []).length ? g.members.map(m => contactHtml({ ...m, role: [m.role, m.territory && (terrName(m.territory) || m.territory)].filter(Boolean).join(", ") })).join("") : emptyTxt("Members not added yet.")}</div>
    </div>`;
}
function pageNewsletter() {
  return `<div class="crumbs"><a href="#/">Home</a> › Newsletter</div>
    <div class="page-head"><div><h1>ASLP Newsletter</h1>
    <p class="lead">Every issue of the ASLP newsletter, readable as a digital book with turnable pages, or downloadable as a PDF.</p></div><img class="deco" src="brand/doodles-2.webp" alt="" aria-hidden="true"></div>
    <div class="soon">The first issues are coming soon.</div>`;
}
const notFound = () => `<h1>Page not found</h1><p><a href="#/">Back to the ASLP home page</a></p>`;

// ---- router ----
function route() {
  if (!data) return;
  const parts = (location.hash.replace(/^#\/?/, "") || "").split("/").filter(Boolean);
  const [p, a] = parts;
  const html = !p ? pageHome() : p === "about" ? pageAbout() : p === "cwgs" ? pageCwgs() : p === "zone" ? pageZone(a) : p === "cwg" ? pageCwg(a)
    : p === "territory" ? pageTerritory(a) : p === "groups" ? pageGroups() : p === "group" ? pageGroup(a) : p === "newsletter" ? pageNewsletter() : notFound();
  $("view").innerHTML = html;
  const nav = p === "zone" || p === "cwg" || p === "territory" ? "cwgs" : p === "group" ? "groups" : p;
  document.querySelectorAll("[data-nav]").forEach(x => x.classList.toggle("on", x.dataset.nav === nav));
  $("menu").classList.remove("open"); $("menu-btn").setAttribute("aria-expanded", "false");
  const h1 = $("view").querySelector("h1"); document.title = (p && h1 ? h1.textContent + " | " : "") + "ASLP | Asia-Pacific Sharing & Learning Programme";
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
load().then(route).catch(e => { $("view").innerHTML = `<div class="soon">Sorry, the site couldn't load just now. Please refresh the page.</div>`; console.error(e); });
</script>
</body>
</html>
